<div class="login-box">
	<h2>Change password</h2>
	<form (ngSubmit)="submit()">
		<div class="user-box">
			<input [(ngModel)]="currentPassword" type="password" name="currentPassword" autocomplete="current-password" required>
			<label>Current password</label>
		</div>
		<div class="user-box">
			<input [(ngModel)]="newPassword" type="password" name="newPassword" autocomplete="new-password" required>
			<label>New password</label>
		</div>
		<div class="user-box">
			<input [(ngModel)]="confirmPassword" type="password" name="confirmPassword" autocomplete="new-password" required>
			<label>Confirm new password</label>
		</div>
		<div class="centered-container">
			<button class="btn btn-outline-dark btn-outline-dark-white-text" type="submit" [disabled]="submitting || !!successMessage">Save</button>
			<button class="btn btn-outline-dark btn-outline-dark-white-text ms-2" type="button" (click)="cancel()">Cancel</button>
		</div>
	</form>
	<p *ngIf="errorMessage" class="message error">{{ errorMessage }}</p>
	<p *ngIf="successMessage" class="message success">{{ successMessage }}</p>
</div>
